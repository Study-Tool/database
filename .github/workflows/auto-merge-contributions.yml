name: Daily Batch Community Contribution Auto-Merger

on:
  schedule:
    - cron: '0 2 * * *' # Run once daily at 02:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: community-database-merge
  cancel-in-progress: false

jobs:
  batch-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test suite
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_restricted_course_sharing.py'

      - name: Process Open Contributions in Daily Batch
        id: batch_step
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // Find open community-contribution issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'community-contribution',
              per_page: 100
            });

            console.log(`Found ${issues.data.length} open community contribution issue(s) to process.`);
            if (issues.data.length === 0) {
              core.setOutput('has_merged', 'false');
              return;
            }

            const processedIssues = [];
            let totalNewMerged = 0;
            let totalConfirmations = 0;

            for (const issue of issues.data) {
              try {
                // Collect issue body plus any appended comment payloads
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 50
                });

                const payloadsToProcess = [issue.body || ''];
                if (comments && comments.data) {
                  for (const c of comments.data) {
                    if (c.body && c.body.includes('Technical payload')) {
                      payloadsToProcess.push(c.body);
                    }
                  }
                }

                for (const rawPayload of payloadsToProcess) {
                  fs.writeFileSync('/tmp/issue_payload.txt', rawPayload, 'utf8');
                  const output = execSync('python3 scripts/merge_contributions.py /tmp/issue_payload.txt', { encoding: 'utf8' }).trim();
                  console.log(`Merged issue #${issue.number} payload: ${output}`);
                  try {
                    const parsed = JSON.parse(output);
                    totalNewMerged += (parsed.newMerged || 0);
                    totalConfirmations += (parsed.updatedConfirmations || 0);
                  } catch (_) {}
                }

                // Close issue with clean summary comment (Zero generic emojis)
                const commentBody = `Contribution Validated and Merged\n\nThank you for contributing to the community study archive.\nAll verified changes from this issue have been consolidated into the daily batch merge.`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: commentBody
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });

                processedIssues.push(issue.number);
              } catch (err) {
                console.error(`Error processing issue #${issue.number}:`, err);
              }
            }

            core.setOutput('has_merged', processedIssues.length > 0 ? 'true' : 'false');
            core.setOutput('processed_count', String(processedIssues.length));

      - name: Commit and push daily consolidated batch
        if: steps.batch_step.outputs.has_merged == 'true'
        run: |
          set -e
          git config user.name "AcademicContributor"
          git config user.email "academic-contributor@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            GIT_COMMITTER_NAME="AcademicContributor" GIT_COMMITTER_EMAIL="academic-contributor@users.noreply.github.com" \
              git commit -m "chore(batch): merge daily community contributions [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
